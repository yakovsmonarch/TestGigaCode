<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Яков Петров — Frontend-разработчик</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="#" class="nav__logo" data-name="logo"></a>
            <ul class="nav__links">
                <li><a href="#about">Обо мне</a></li>
                <li><a href="#skills">Навыки</a></li>
                <li><a href="#projects">Портфолио</a></li>
                <li><a href="#contact">Контакты</a></li>
            </ul>
            <button class="nav__toggle" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="container hero__content">
                <div class="hero__text">
                    <p class="hero__greeting">Привет, я</p>
                    <h1 class="hero__name" data-name="hero"></h1>
                    <h2 class="hero__title" data-title="hero"></h2>
                    <p class="hero__bio" data-bio="hero"></p>
                    <div class="hero__actions">
                        <a href="#projects" class="btn btn--primary">Портфолио</a>
                        <a href="#contact" class="btn btn--outline">Контакты</a>
                    </div>
                </div>
                <div class="hero__avatar">
                    <img id="avatar" src="" alt="Фото">
                </div>
            </div>
        </section>

        <section id="about" class="about section">
            <div class="container">
                <h2 class="section__title">Обо мне</h2>
                <div class="about__info" data-location="about">
                    <p class="about__detail">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                        <span data-email="about"></span>
                    </p>
                    <p class="about__detail">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        <span data-phone="about"></span>
                    </p>
                    <p class="about__detail">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                        <span data-location="about"></span>
                    </p>
                </div>
                <div class="about__social" data-social="about"></div>
            </div>
        </section>

        <section id="skills" class="skills section">
            <div class="container">
                <h2 class="section__title">Навыки</h2>
                <div class="skills__grid" data-skills="skills"></div>
            </div>
        </section>

        <section id="projects" class="projects section">
            <div class="container">
                <h2 class="section__title">Портфолио</h2>
                <div class="projects__grid" data-projects="projects"></div>
            </div>
        </section>

        <section id="contact" class="contact section">
            <div class="container">
                <h2 class="section__title">Контакты</h2>
                <p class="contact__text">Свяжитесь со мной для обсуждения проекта или сотрудничества</p>
                <a class="contact__email" data-email="contact"></a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="year"></span> <span data-name="footer"></span>. Все права защищены.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
